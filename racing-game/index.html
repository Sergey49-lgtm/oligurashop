<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Дорожный Стрелок</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      background: #2b2b2b;
      box-shadow: 0 0 30px rgba(0, 0, 0, .6);
    }
    #touch {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: none;
      justify-content: space-between;
      padding: 12px;
      pointer-events: none;
    }
    #touch .group { display: flex; gap: 10px; }
    #touch button {
      pointer-events: auto;
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .5);
      background: rgba(255, 255, 255, .15);
      color: #fff;
      font-size: 24px;
    }
    #touch button.fire { width: 80px; height: 80px; background: rgba(255, 80, 80, .35); }
    @media (pointer: coarse) { #touch { display: flex; } }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="420" height="720"></canvas></div>
  <div id="touch">
    <div class="group">
      <button data-key="left">◀</button>
      <button data-key="right">▶</button>
    </div>
    <div class="group">
      <button data-key="up">▲</button>
      <button data-key="fire" class="fire">🔥</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
